version: 2

# The addon is compiled from source with prebuildify and loaded via
# node-gyp-build; there is no prebuilt download step in CI.
build_and_test: &build_and_test
  steps:
    - checkout
    - setup_remote_docker:
        docker_layer_caching: true
    - run:
        name: "Pull submodules"
        command: |
          git submodule init
          git submodule sync
          git submodule update
    - run:
        name: Install dependencies
        command: npm ci
        when: on_success
    - run:
        name: Build addon (prebuildify)
        command: JOBS=max npm run build
        when: on_success
    - run:
        name: Test
        command: npm run test
        when: on_success

jobs:
  "node-20":
    <<: *build_and_test
    docker:
      - image: node:20
  "node-22":
    <<: *build_and_test
    docker:
      - image: node:22
  "node-24":
    <<: *build_and_test
    docker:
      - image: node:24

workflows:
  version: 2
  build:
    jobs:
      - "node-20"
      - "node-22"
      - "node-24"
